# ============================================================
#  Ground Control II — DXVK configuration
# ============================================================
#
#  Place this file next to gcii.exe in the game folder.
#  No game files are modified.
#
#  Launcher: just click Play in Steam. No scripts, no launch
#  options, no environment variables needed.
#
# ------------------------------------------------------------
#  ⚠⚠  YOU MUST CHANGE TWO VALUES  ⚠⚠
# ------------------------------------------------------------
#
#  1) d3d9.forceRefreshRate
#     Set this to YOUR monitor's maximum refresh rate.
#     Look it up in: Settings -> System -> Display -> Advanced display
#     Examples: 144 / 165 / 240 / 300
#     Do NOT leave it at a value your monitor does not support.
#
#  2) dxvk.deviceFilter
#     Set this to YOUR GPU vendor: "NVIDIA" / "AMD" / "Intel"
#     If your PC has ONLY one GPU (a discrete card, no integrated),
#     you may delete this line entirely.
#     If you have BOTH integrated and discrete graphics (typical for
#     laptops and many desktops), KEEP this line and point it at the
#     discrete GPU — otherwise the game may pick an adapter with no
#     3D capability and hang on a black screen.
#
#  Everything else below is generic and should be left as-is.
#
# ------------------------------------------------------------
#  Symptom -> setting map (why each value is here)
# ------------------------------------------------------------
#
#  Black screen / hang on launch
#     -> fixed by DXVK taking over D3D9 at all
#
#  Vertical-stripe artifacts
#     -> fixed by d3d9.forceRefreshRate matching your display
#
#  Mouse frozen in game
#     -> fixed by dxvk.enablePresentTiming = False
#        plus d3d9.presentInterval = -1
#
#  Rendering squeezed into the top-left corner, mouse coordinates offset
#     -> fixed by the swapchain / fullscreen settings below
#
#  Wrong GPU selected (iGPU instead of dGPU)
#     -> fixed by dxvk.deviceFilter
#
# ------------------------------------------------------------
#  Verifying it worked
# ------------------------------------------------------------
#
#  Launch the game, then open the generated gcii_d3d9.log in the
#  game folder and check:
#
#    "Found config file: dxvk.conf"      -> config was read
#    "Found device: <your GPU>"          -> correct GPU selected
#    "Buffer size:" appears ONCE and matches "Requested" width/height
#    the string "199x34" does NOT appear  <-- key indicator
#
#  If you see "Buffer size:  199x34", the picture will be squeezed
#  into a corner and the mouse will be off. Check your two settings above.
#
# ------------------------------------------------------------
#  Known limitation (game engine, not fixable by config)
# ------------------------------------------------------------
#
#  The in-game resolution dropdown only ever shows 5 low-resolution
#  options. The game reads only the FIRST 5 entries of the enumerated
#  resolution list, and Windows enumerates in ascending width order,
#  so the first 5 are always roughly:
#
#      640x480, 720x480, 720x576, 800x600, 1024x768
#
#  Your native resolution sits far beyond that index and is unreachable.
#  However the RENDERING AREA is still correct and full-screen — the
#  picture is scaled to fill the display. Only the dropdown is limited.
#
# ============================================================


# ------------------------------------------------------------
# 1. Refresh rate / mode list
# ------------------------------------------------------------

# ★ CHANGE THIS to your monitor's maximum refresh rate.
d3d9.forceRefreshRate = 300

# Keep the full mode list available to the engine.
d3d9.modeCountCompatibility = False

# Enumerate adapters per display.
d3d9.enumerateByDisplays = True


# ------------------------------------------------------------
# 2. Presentation / mouse fix
# ------------------------------------------------------------

# ★ Fixes the frozen mouse.
dxvk.enablePresentTiming = False

# Immediate present; avoids frame-pacing stalls.
d3d9.presentInterval = -1

# The engine is not designed for high frame rates.
d3d9.maxFrameRate = 60

# Tearing-free presentation caused stalls on this title.
dxvk.tearFree = False


# ------------------------------------------------------------
# 3. Swapchain / fullscreen
# ------------------------------------------------------------

# Borderless simulated fullscreen — this is the verified-stable mode
# for this title on Windows 11. Do not set it to True.
dxvk.allowFse = False
d3d9.deferSurfaceCreation = False
d3d9.lenientClear = True
d3d9.maxFrameLatency = 0


# ------------------------------------------------------------
# 4. GPU selection
# ------------------------------------------------------------

# ★ CHANGE THIS to your GPU vendor: "NVIDIA" / "AMD" / "Intel"
#   Delete this line if you have only one GPU.
dxvk.deviceFilter = "NVIDIA"

dxvk.hideIntegratedGraphics = False


# ------------------------------------------------------------
# 5. Legacy format support (2004-era engine)
# ------------------------------------------------------------

d3d9.supportX4R4G4B4 = True
d3d9.supportDFFormats = True
d3d9.floatEmulation = Auto
d3d9.shaderModel = 3

# Correct window sizing on displays with DPI scaling.
d3d9.dpiAware = True


# ------------------------------------------------------------
# 6. Memory
# ------------------------------------------------------------

d3d9.textureMemory = 100
d3d9.deviceLocalConstantBuffers = Auto


# ------------------------------------------------------------
# 7. Debug (optional)
# ------------------------------------------------------------

# Uncomment to show an on-screen FPS overlay:
# dxvk.hud = fps
